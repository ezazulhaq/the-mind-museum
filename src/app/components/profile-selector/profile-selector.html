<div
  class="min-h-screen bg-slate-950 text-slate-200 flex flex-col items-center justify-center p-6 relative overflow-hidden"
>
  <!-- Decorative background glow -->
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
    <div
      class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-cyan-900/30 blur-[120px]"
    ></div>
    <div
      class="absolute top-[60%] -right-[10%] w-[60%] h-[60%] rounded-full bg-indigo-900/20 blur-[100px]"
    ></div>
  </div>

  <div
    class="relative z-10 w-full max-w-md bg-slate-900/60 backdrop-blur-xl border border-slate-700/50 p-8 rounded-2xl shadow-2xl shadow-black/50"
  >
    <div class="text-center mb-8">
      <h1
        class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400 mb-2"
      >
        The Mind Museum
      </h1>
      <h2 class="text-lg text-slate-400 font-medium">Create Your Profile</h2>
    </div>

    <div class="space-y-6">
      <div class="space-y-2">
        <label for="username" class="block text-sm font-medium text-slate-300">Username</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          placeholder="Enter your museum alias"
          [disabled]="loading()"
          class="w-full bg-slate-800/80 border border-slate-600 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-400 transition-all duration-300"
        />
      </div>

      <button
        (click)="createProfile()"
        [disabled]="loading() || !username().trim()"
        class="w-full bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-cyan-900/20 transition-all duration-300 transform hover:-translate-y-1 hover:shadow-cyan-500/30 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
      >
        <span class="flex items-center justify-center gap-2">
          {{ loading() ? 'Initializing...' : 'Enter the Museum' }}
          @if (!loading()) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                clip-rule="evenodd"
              />
            </svg>
          }
          @if (loading()) {
            <svg
              class="animate-spin h-5 w-5 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
          }
        </span>
      </button>
    </div>
  </div>
</div>
