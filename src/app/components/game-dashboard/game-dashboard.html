<div class="dashboard-container">
  <h2>The Mind Museum - Wings</h2>
  
  <div class="games-grid">
    <div class="game-card" *ngFor="let game of games">
      <div class="wing-badge">{{ game.wing }}</div>
      <h3>{{ game.title }}</h3>
      <p>{{ game.description }}</p>
      <button 
        class="btn btn-primary" 
        [disabled]="game.id === 'g6'"
        [routerLink]="
          game.id === 'g1' ? ['/games/terminal-velocity'] : 
          (game.id === 'g2' ? ['/games/node-network'] : 
          (game.id === 'g3' ? ['/games/logic-gate-defender'] : 
          (game.id === 'g4' ? ['/games/contraption-crafter'] : 
          (game.id === 'g5' ? ['/games/algorithmic-alchemist'] : null))))
        "
      >
        {{ game.id !== 'g6' ? 'Play' : 'Coming Soon' }}
      </button>
    </div>
  </div>
</div>
