<app-game-layout>
  <div game-area
    class="w-full h-full relative overflow-hidden flex flex-col items-center justify-center bg-slate-950 rounded-l-3xl">
    <!-- Dynamic Background Glow -->
    <div
      class="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-cyan-900/10 blur-[100px] pointer-events-none animate-pulse"
      style="animation-duration: 8s;"></div>

    <div class="relative z-10 flex-1 w-full h-full flex justify-center items-center overflow-hidden" #gameContainer>
    </div>
  </div>

  <div control-panel class="w-full h-full flex flex-col justify-center">
    <h2 class="text-2xl font-bold text-white tracking-tighter mb-4">Contraption Crafter</h2>
    <p class="text-slate-400 text-sm mb-6">Build complex mechanical contraptions to move the target object to its
      destination using physics.</p>

    <!-- Additional controls can go here later -->
    <div
      class="flex-1 bg-slate-900/40 rounded-xl border border-slate-700/50 p-6 flex flex-col items-center justify-center text-center shadow-inner">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-slate-500 mb-4" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <h3 class="text-slate-300 font-bold mb-2">Controls</h3>
      <p class="text-slate-500 text-sm">Select items from the inventory and place them into the world.</p>
    </div>
  </div>
</app-game-layout>
